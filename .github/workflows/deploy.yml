name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/fix-charts-data-display-sXHLX
  schedule:
    # Refresh the baked data every 6 hours (runs from the default branch only)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chromium system libraries (for Puppeteer scrapers)
        # Non-fatal: missing libs only affect the 3 Puppeteer scrapers, which the
        # data script already tolerates. Never block the deploy on this.
        run: |
          sudo apt-get update || true
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libatspi2.0-0 || true

      - name: Install dependencies
        # npm install (not ci) to tolerate lockfile metadata drift in the repo
        run: npm install --no-audit --no-fund

      - name: Generate static data (scrapers + SEC/Yahoo)
        run: node scripts/build-data.js

      - name: Build site
        run: npm run build

      - name: Add SPA fallback for client-side routes
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
